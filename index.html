<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First GitHub Pages Site</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 48px 32px;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    h1 {
      font-size: 2.2em;
      margin-bottom: 8px;
    }
    p {
      font-size: 1.1em;
      opacity: 0.9;
      line-height: 1.5;
    }
    button {
      margin-top: 24px;
      padding: 12px 28px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      background: #ffffff;
      color: #764ba2;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    button:hover {
      transform: scale(1.05);
    }
    #message {
      margin-top: 16px;
      font-size: 1em;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Hello, Mr. J!</h1>
    <p>This is my very first website, built and published with GitHub Pages.</p>
    <button onclick="sayHi()">Click me!</button>
    <p id="message"></p>
  </div>

  <script>
    function sayHi() {
      document.getElementById("message").textContent = "🎉 Uuuups, you clicked the button!";
    }
  </script>
</body>
</html>
